; Press-On v2 firmware
; Build with PlatformIO:  pio run -e xiao_esp32c3 -t upload
; Or open firmware/PressOnBLE/PressOnBLE.ino in the Arduino IDE
; (board: "XIAO_ESP32C3" or "XIAO_ESP32S3" from the esp32 boards package).

[platformio]
src_dir = PressOnBLE
default_envs = xiao_esp32c3

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
; Only needed if you set HAPTICS_MODE to HAPTICS_DRV2605 in config.h
lib_deps =
  adafruit/Adafruit DRV2605 Library@^1.2.4

[env:xiao_esp32c3]
board = seeed_xiao_esp32c3

[env:xiao_esp32s3]
board = seeed_xiao_esp32s3
